name: Frappe v16 tests

on:
  push:
    branches: [v-16]
  pull_request:
    branches: [v-16]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/whitelabel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bench
        run: pip install frappe-bench

      - name: Create Frappe v16 bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench get-app erpnext --branch version-16
          cp -r "$GITHUB_WORKSPACE/apps/whitelabel" apps/whitelabel
          bench new-site test_site --db-root-password root --admin-password admin
          bench --site test_site set-config allow_tests true

      - name: Install applications
        run: |
          cd frappe-bench
          bench --site test_site install-app erpnext
          bench --site test_site install-app whitelabel
          bench --site test_site migrate

      - name: Build and test
        run: |
          cd frappe-bench
          bench build --app whitelabel
          bench --site test_site run-tests --app whitelabel
